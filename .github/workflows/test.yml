name: tests

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code; keep the token read-only even though the repo
# default is write and the actions are pinned to moving tags.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # same ruff as .pre-commit-config.yaml
      - run: uvx ruff@0.16.10 format --check .
      - run: uvx ruff@0.16.10 check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # the slow script tests don't depend on the Python version: run them on 3.12 only
      - run: uv run pytest -q --cov --cov-report=term ${{ matrix.python-version != '3.12' && '-m "not slow"' || '' }}
        env:
          MPLBACKEND: Agg
      # one table per run is enough; the matrix entries cover the same code
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          echo "## Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --no-skip-covered >> "$GITHUB_STEP_SUMMARY"

  # the goldens hold on any hardware: prove it on arm64 too. One job only:
  # macOS minutes bill at 10x on private repos
  pytest-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q -m "not slow"
        env:
          MPLBACKEND: Agg

  # the Rust right-hand side (rust/, the `fast` extra): lint the crate, build
  # it, and run the suite with mode="fast" as the default. The jobs above
  # never install it, so they keep testing the pure-Python fallback.
  pytest-fast:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy -- -D warnings
        working-directory: rust
      # the crate's own tests (the pyo3 extension-module feature is off in
      # Cargo.toml, so the test binary links; maturin turns it on for wheels)
      - run: cargo test
        working-directory: rust
      - run: uv sync --locked --extra fast
      # bit-identical to the numpy reference on this runner? The self-check
      # (differing states, states compared, largest relative difference),
      # then one threshold search in both modes
      - name: Self-check
        run: |
          uv run python -W ignore -c "$SCRIPT" | tee self_check.txt
          echo "Rust RHS on ${{ matrix.os }}: $(cat self_check.txt)" >> "$GITHUB_STEP_SUMMARY"
        env:
          SCRIPT: |
            from msoaxon import _fast, coincidence
            assert _fast.available()
            th = {m: coincidence.threshold("multi", 0.1, model_kw={"mode": m}) for m in _fast.MODES}
            print(f"self_check {_fast.self_check(64)}; threshold(delay 0.1) {th}")
      - run: uv run pytest -q
        env:
          MPLBACKEND: Agg
