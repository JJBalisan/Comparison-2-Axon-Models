name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # the slow script tests don't depend on the Python version: run them on 3.12 only
      - run: uv run pytest -q --cov --cov-report=term ${{ matrix.python-version != '3.12' && '-m "not slow"' || '' }}
        env:
          MPLBACKEND: Agg
      # one table per run is enough; the matrix entries cover the same code
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          echo "## Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --no-skip-covered >> "$GITHUB_STEP_SUMMARY"
