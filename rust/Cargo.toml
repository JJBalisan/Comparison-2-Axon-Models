[package]
name = "msoaxon-fast"
version = "1.5.0"
edition = "2021"
rust-version = "1.99"  # see rust-toolchain.toml
description = "Rust right-hand side for msoaxon's 45-compartment model"
publish = false

[lib]
name = "msoaxon_fast"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py311"] }
numpy = "0.25"
# default-features = false: the `nalgebra`/`faer` features only forward to
# diffsol-la/-nl, which diffsol already enables unconditionally, so the empty
# set still gives FaerSparseMat + FaerSparseLU + OdeBuilder + bdf.
diffsol = { version = "=0.18.0", default-features = false }
# diffsol 0.18 does not re-export the linear-solver trait integrate.rs's
# structured solver implements (diffsol-la is already its dependency)
diffsol-la = { version = "=0.3.0", default-features = false }

[profile.release]
opt-level = 3
