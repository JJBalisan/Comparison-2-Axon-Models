[package]
name = "msoaxon-fast"
version = "1.4.0"
edition = "2021"
rust-version = "1.99"  # see rust-toolchain.toml
description = "Rust right-hand side for msoaxon's 45-compartment model"
publish = false

[lib]
name = "msoaxon_fast"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py311"] }
numpy = "0.25"

[profile.release]
opt-level = 3
